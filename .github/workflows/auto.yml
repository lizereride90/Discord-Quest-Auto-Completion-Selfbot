name: Run quest auto completion bot

on:
    workflow_dispatch:
        inputs:
            mode:
                description: 'Run mode'
                required: false
                default: 'full'
                type: choice
                options:
                    - full
                    - claim-only
    schedule:
        - cron: '15 0 * * *'
        - cron: '30 12 * * *'

jobs:
    run-bot:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Install dependencies
              run: |
                  if [ -f package-lock.json ]; then
                    npm ci
                  else
                    npm install
                  fi

            - name: Run the bot (full)
              if: ${{ inputs.mode != 'claim-only' && github.event.schedule != '30 12 * * *' }}
              env:
                  TOKEN: ${{ secrets.TOKEN }}
                  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
              run: |
                  npm run github

            - name: Claim unclaimed rewards (claim-only)
              if: ${{ inputs.mode == 'claim-only' || github.event.schedule == '30 12 * * *' }}
              env:
                  TOKEN: ${{ secrets.TOKEN }}
                  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
              run: |
                  npm run claim
